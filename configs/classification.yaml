# Tarea 1 (§4.1): clasificacion de 7 clases con fine-tuning + CBAM (§4.3).
# La ablacion se corre con el mismo archivo y el flag --no-cbam, para que el unico
# factor que cambia entre las dos corridas sea el bloque de atencion.

paths_config: configs/paths.yaml

model:
  backbone: resnet34          # resnet34 | resnet50
  pretrained: true
  num_classes: 7
  use_cbam: true
  cbam_stages: [layer3, layer4]
  cbam_reduction: 16
  cbam_spatial_kernel: 7
  dropout: 0.2

data:
  image_size: 224
  batch_size: 32
  num_workers: 2               # Colab gratuito tiene 2 nucleos de CPU; mas procesos lo ralentizan

train:
  epochs: 25
  optimizer: adamw
  lr: 3.0e-4
  head_lr_multiplier: 10.0    # cabeza nueva aprende mas rapido que el backbone preentrenado
  weight_decay: 1.0e-4
  # ReduceLROnPlateau sobre val_loss:
  # si la perdida de validacion no mejora en 2 epocas, el lr se reduce a la mitad.
  plateau_factor: 0.5
  plateau_patience: 2
  # Desbalance nv:df ~ 58:1. Pesos inversos a la frecuencia, calculados en runtime.
  class_weights: balanced
  amp: true                   # precision mixta en GPU (float16), mas rapido en la T4
  # Sin parada temprana: todas las corridas completan las mismas epocas. Con parada
  # temprana, una inestabilidad pasajera puede cortar una corrida antes que la otra, y la
  # diferencia de la ablacion ya no seria atribuible solo a CBAM. El sobreajuste lo
  # controla el checkpoint, que conserva la mejor epoca y no la ultima.
  early_stopping_patience: null
  monitor: val_macro_f1       # no val_accuracy: el desbalance la hace enganosa

augment:
  # Las imagenes dermatoscopicas no tienen orientacion canonica: voltear preserva la
  # etiqueta. El color se toca con cuidado porque el tono es senal diagnostica real.
  hflip: 0.5
  vflip: 0.5
  brightness: 0.15
  contrast: 0.15
  saturation: 0.1
  hue: 0.02                   # fraccion del circulo de color: +-7 grados

optimize:
  # §4.4 — cuantizacion estatica INT8 con ONNX Runtime
  onnx_opset: 17
  calibration_samples: 200
  fallback: prune             # si INT8 degrada macro-F1 mas de lo aceptable
  max_f1_drop: 0.02
